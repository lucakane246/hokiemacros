name: Build Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-app/**', 'icons/**', '.github/workflows/android.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Create the Android project
        run: npx cap add android
      - name: App icon and splash
        run: npx capacitor-assets generate --android --iconBackgroundColor '#110b0e' --splashBackgroundColor '#110b0e'
      - name: Permissions (location for walking times)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />#' $M
          grep -c ACCESS_FINE_LOCATION $M
      - name: Health Connect (steps)
        run: python3 ../scripts/android_health.py
      - name: Version and signing
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          npx cap sync android
          G=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" $G
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" $G
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/app/upload.jks
            cat >> $G <<GRADLE
          android {
            signingConfigs { release { storeFile file('upload.jks'); storePassword System.getenv('KS_PASS'); keyAlias 'upload'; keyPassword System.getenv('KS_PASS') } }
            buildTypes { release { signingConfig signingConfigs.release } }
          }
          GRADLE
            echo "SIGNED=1" >> $GITHUB_ENV
          fi
      - name: Build
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease
          mkdir -p ../../out
          cp app/build/outputs/apk/debug/app-debug.apk ../../out/HokieMacros-test.apk
          cp app/build/outputs/bundle/release/app-release.aab ../../out/HokieMacros-play-${{ github.run_number }}.aab
          ls -la ../../out
      - name: Publish to the "android" release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android >/dev/null 2>&1 || gh release create android --title "Android app" --notes "Latest Android build. Install HokieMacros-test.apk on a phone to try it. The .aab file is for uploading to Google Play." --latest=false
          gh release upload android out/* --clobber
          gh release edit android --notes "Latest Android build (run ${{ github.run_number }}, $(date -u +%Y-%m-%d)). Install HokieMacros-test.apk on an Android phone to try it. The .aab file is for uploading to Google Play$( [ -n "$SIGNED" ] && echo ' (signed with your upload key)' || echo ' (not signed yet: add the signing secrets first)')."
